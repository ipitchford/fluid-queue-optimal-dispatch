# SPDX-License-Identifier: MIT
name: Replay
on:
  push:
  pull_request:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check SHA256SUMS
        run: sha256sum -c SHA256SUMS
      - name: Install pinned packages
        run: python -m pip install -r requirements.txt
      - name: Replay every computational check
        run: python -B -O -I code/verify_all.py "$RUNNER_TEMP/out"
      - name: Compare with results/ (exact fields exactly, floats to relative 1e-6)
        run: python -B -I tools/compare_results.py results "$RUNNER_TEMP/out" --rel 1e-6
      - name: Report byte identity (informational; floats may differ in the last digit off the release host)
        run: python -B -I tools/compare_results.py results "$RUNNER_TEMP/out" --bytes || true
      - name: Semantic negative controls
        run: python -B -O negative_controls.py
      - name: Simulation smoke test (not compared; the full study is numerical evidence only)
        run: python -B -I code/simulate.py "$RUNNER_TEMP/sim" --quick --processes 2
      - name: Working tree unchanged
        run: git status --porcelain && test -z "$(git status --porcelain)"
